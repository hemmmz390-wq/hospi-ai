    <script>
      // Tema dipasang sebelum React mount, supaya tidak ada kedipan tema salah.
      (function () {
        try {
          // Kunci v2: pilihan tema lama (v1) diabaikan, semua mulai terang.
          localStorage.removeItem("hospi_theme_v1");
          var saved = localStorage.getItem("hospi_theme_v2");
          // Pengunjung baru (belum pernah memilih tema) mulai di mode terang.
          var dark =
            saved === "dark" ||
            (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0e0e0d");
          var size = localStorage.getItem("hospi_textsize_v1");
          if (size === "large") document.documentElement.style.fontSize = "112.5%";
          if (size === "xlarge") document.documentElement.style.fontSize = "125%";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
