<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HOSPI AI — Hotel service operations</title>
    <meta name="description" content="HOSPI AI turns every guest request into a routed, tracked task for the right hotel team." />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f6f1e6'/%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round' transform='translate%283.2 3.2%29 scale%280.9%29'%3E%3Ccircle cx='32' cy='7.6' r='2.8' stroke='%23c8a15a' stroke-width='3'/%3E%3Cpath d='M15.5 25C15.5 16.5 22.8 10.6 32 10.6S48.5 16.5 48.5 25' stroke='%23c8a15a' stroke-width='3.6'/%3E%3Cpath d='M14 25H37' stroke='%23c8a15a' stroke-width='3.6'/%3E%3Cpath d='M24 28.5H40C48.5 28.5 54 34 54 41S48.5 53.5 40 53.5H27.5L15.5 59.5L18 50.8C13 48.8 10 45.3 10 41C10 34 15.5 28.5 24 28.5Z' stroke='%23134032' stroke-width='4'/%3E%3Cpath d='M24.5 41C29 45.6 35 45.6 39.5 41' stroke='%23c8a15a' stroke-width='3.6'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Tema dipasang sebelum React mount, supaya tidak ada kedipan tema salah.
      (function () {
        try {
          var saved = localStorage.getItem("hospi_theme_v1");
          // Pengunjung baru (belum pernah memilih tema) mulai di mode terang.
          var dark =
            saved === "dark" ||
            (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var size = localStorage.getItem("hospi_textsize_v1");
          if (size === "large") document.documentElement.style.fontSize = "112.5%";
          if (size === "xlarge") document.documentElement.style.fontSize = "125%";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
